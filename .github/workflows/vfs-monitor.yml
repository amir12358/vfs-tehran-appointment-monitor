name: VFS Tehran appointment monitor

# Runs one check cycle on GitHub's own servers (free for public repositories).
# Two reasons this exists:
#   1. it is a full monitor host that costs nothing and needs no server of yours,
#   2. its IP address is outside the Netherlands, so the first manual run tells us
#      whether the site accepts a non-NL address at all.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: vfs-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_STATUS_CHAT_ID: ${{ secrets.TELEGRAM_STATUS_CHAT_ID }}
      TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
      VFS_EMAIL: ${{ secrets.VFS_EMAIL }}
      VFS_PASSWORD: ${{ secrets.VFS_PASSWORD }}
      TASK_SCHEDULER_MODE: 'True'
      # A real display (virtual screen) is far less suspicious than headless mode.
      PLAYWRIGHT_HEADLESS: 'False'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Restore previous state and browser profile
        uses: actions/cache@v4
        with:
          path: |
            vfs_state.json
            .browser_profile
          key: vfs-state-${{ github.run_id }}
          restore-keys: |
            vfs-state-

      - name: Run one check cycle
        run: xvfb-run -a python monitor.py --once

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vfs-diagnostics
          path: |
            recon_out/
            screenshots/
            vfs_monitor.log
          if-no-files-found: ignore
